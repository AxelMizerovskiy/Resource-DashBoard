[package]
name = "rdb" # resource dash board
version = "0.1.0"
edition = "2024"

[dependencies]
# system monitoring 
sysinfo = "0.30"

# terminal ui engine
ratatui = "0.26" 

# ratatui requirments
crossterm = { version = "0.27", features = ["events"] }

# command line parser
clap = { version = "4.5", features = ["derive"] }


